<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#160f0b" />
    <title>The Cool Butler｜廟會和平大使</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div><div class="eyebrow">廟會維安執事 · 3D WebGL</div><h1>The Cool Butler</h1></div>
        <div class="top-actions">
          <button id="soundToggleBtn" class="secondary-btn" type="button" aria-pressed="true">🔊 音效開</button>
          <button id="newGameBtn" class="primary-btn" type="button">重新開始</button>
        </div>
      </header>
      <main class="game-layout">
        <section class="hud-panel" aria-label="遊戲狀態">
          <div class="score-box"><span>聖望聲譽</span><strong id="shengWangValue">0</strong></div>
          <div class="score-box warm"><span>歡慶熱鬧度</span><strong id="festivalValue">0</strong></div>
          <div class="score-box danger"><span>警方警戒度</span><strong id="policeValue">0</strong></div>
          <div class="score-box bad"><span>民俗污名化</span><strong id="stigmaValue">0</strong></div>
          <div class="timer-panel"><div class="label-row"><span>遶境倒數</span><strong id="timerValue">35.0s</strong></div><div class="progress-bar"><div id="timerBar"></div></div></div>
          <div class="skill-list">
            <button class="skill-btn" data-skill="Q" type="button"><span class="key">Q</span><span>遞結緣水</span></button>
            <button class="skill-btn" data-skill="W" type="button"><span class="key">W</span><span>貼平安符</span></button>
            <button class="skill-btn" data-skill="E" type="button"><span class="key">E</span><span>吹號鎮喧</span></button>
            <button class="skill-btn" data-skill="R" type="button"><span class="key">R</span><span>劃界結界</span></button>
          </div>
          <div class="tips-box"><h3>執事任務</h3><p>使用法器化解衝突，守住遶境秩序。警戒或污名值達 100 就會中斷活動。</p><p>按 Q／W／E／R 施法，或點擊技能按鈕。可拖曳 3D 場景旋轉、滾輪縮放。</p></div>
        </section>
        <section class="arena-panel" aria-label="3D 廟會遊戲場景">
          <div id="gameCanvas" role="img" aria-label="可互動的 3D 廟會場景"></div>
          <div class="scene-hint">拖曳旋轉場景 · 滾輪縮放</div>
          <div id="overlay" class="overlay hidden"><div class="overlay-card"><h2 id="overlayTitle">遶境結束</h2><p id="overlayText">你平息了多少衝突？</p><button id="shareBtn" class="primary-btn" type="button">複製 Threads 文案</button></div></div>
        </section>
      </main>
      <p class="footnote">音效由 Web Audio API 即時合成；首次操作後即可播放。3D 場景使用 Three.js。</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="game.js"></script>
  </body>
</html>
